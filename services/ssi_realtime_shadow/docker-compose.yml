services:
  collector:
    build: .
    image: ccc-ssi-realtime:local
    container_name: ccc-ssi-shadow
    user: "1001:1001"
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      DATABASE_PATH: /app/data/ssi_shadow.db
      CANONICAL_MARKET_DIR: /app/data
      CANONICAL_ENGINE_PATH: /app/data/ccc_engine.db
      CANONICAL_ENGINE_ENABLED: "true"
      CANONICAL_SIGNAL_ENABLED: "true"

  chart-api:
    image: ccc-ssi-realtime:local
    container_name: ccc-chart-api
    restart: unless-stopped
    volumes:
      - ./data:/app/data:ro
    command:
      - python
      - -m
      - app.chart_api
      - --host
      - 0.0.0.0
      - --port
      - "8787"
      - --canonical-market-dir
      - /app/data
    ports:
      - "10.0.0.226:8787:8787"

  live-ws:
    image: ccc-ssi-realtime:local
    container_name: ccc-live-ws
    restart: unless-stopped
    user: "1001:1001"
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro
    command:
      - python
      - -m
      - app.live_ws
      - --host
      - 0.0.0.0
      - --port
      - "8790"
      - --interval
      - "3"
      - --canonical-market-dir
      - /app/data
    ports:
      - "10.0.0.226:8790:8790"

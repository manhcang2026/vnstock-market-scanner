services:
  collector:
    build: .
    image: ccc-ssi-realtime:local
    container_name: ccc-ssi-shadow
    user: "1001:1001"
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      DATABASE_PATH: /app/data/ssi_shadow.db
      VOLUME_BASELINE_PATH: /app/data/ccc_v2_baseline.db
      MARKET_V2_DATABASE_PATH: /app/data/ccc_market_v2.db
      SSI_HISTORY_PATH: /app/data/ssi_history_2026.db
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - app.watchdog_check
        - --database
        - /app/data/ssi_shadow.db
        - --max-age-seconds
        - "90"
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 180s

  chart-api:
    image: ccc-ssi-realtime:local
    container_name: ccc-chart-api
    restart: unless-stopped
    volumes:
      - ./data:/app/data:ro
    command:
      - python
      - -m
      - app.chart_api
      - --host
      - 0.0.0.0
      - --port
      - "8787"
    ports:
      - "10.0.0.226:8787:8787"

  live-ws:
    image: ccc-ssi-realtime:local
    container_name: ccc-live-ws
    restart: unless-stopped
    user: "1001:1001"
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro
    command:
      - python
      - -m
      - app.live_ws
      - --host
      - 0.0.0.0
      - --port
      - "8790"
      - --interval
      - "3"
    ports:
      - "10.0.0.226:8790:8790"

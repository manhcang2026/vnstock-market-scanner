name: Build Watchlist

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-watchlist:
    runs-on: ubuntu-latest

    steps:
      - name: Lay source code
        uses: actions/checkout@v5

      - name: Cai dat Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cai thu vien
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kiem tra watchlist
        run: python src/build_watchlist.py

      - name: Luu ket qua
        uses: actions/upload-artifact@v6
        with:
          name: cleaned-watchlist
          path: |
            config/watchlist.csv
            output/watchlist_rejected.csv
          if-no-files-found: error
          retention-days: 7

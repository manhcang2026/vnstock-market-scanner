name: Test Price Board Batch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-price-board-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Lay source code
        uses: actions/checkout@v5

      - name: Cai dat Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cai thu vien
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test bang gia hang loat
        run: python src/test_price_board_batch.py

      - name: Luu ket qua
        uses: actions/upload-artifact@v6
        with:
          name: price-board-batch-test
          path: output/price_board_batch_test.csv
          if-no-files-found: error
          retention-days: 7

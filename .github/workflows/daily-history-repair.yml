name: Daily History Repair

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Danh sach ma canonical sync, phan tach bang dau phay."
        required: true
        default: "TLP,VIT,CLC,VNC,MAC,PDN"
        type: string
      write:
        description: "false = dry-run; true = canonical upsert + safe reconcile."
        required: true
        default: false
        type: boolean
      confirm:
        description: "Chi khi write=true: go WRITE de xac nhan."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: daily-history-canonical-phase-b
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # TEMPORARY FEATURE-BRANCH HARNESS - PHASE B.
      # Main van giu workflow Repair cu.
      # Tren feature/daily-history-canonical-store, workflow nay chay canonical sync.
      - name: Canonical daily history sync
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CANONICAL_SYMBOLS: ${{ inputs.symbols }}
          CANONICAL_WRITE: ${{ inputs.write }}
          CANONICAL_CONFIRM: ${{ inputs.confirm }}
        run: python src/canonical_history_sync.py

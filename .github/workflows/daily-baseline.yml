name: Daily Baseline

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "local_history = production default; provider = legacy rollback."
        required: true
        default: local_history
        type: choice
        options:
          - local_history
          - provider
      run_date:
        description: "Chi local_history: history_exclusive_date YYYY-MM-DD; de trong = tu dong."
        required: false
        default: ""
        type: string
      write_local:
        description: "Chi local_history: false = dry-run; true = ghi daily_baseline."
        required: true
        default: false
        type: boolean
      confirm:
        description: "Chi local_history write=true: bat buoc nhap CUTOVER."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: daily-baseline
  cancel-in-progress: false

jobs:
  daily-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate local history cutover script
        if: ${{ inputs.engine == 'local_history' }}
        run: python -m py_compile src/daily_baseline_from_history.py

      - name: Calculate baseline - legacy provider engine
        if: ${{ inputs.engine == 'provider' }}
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python src/daily_baseline_after_close.py

      - name: Calculate baseline - local daily_history engine
        if: ${{ inputs.engine == 'local_history' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOCAL_BASELINE_RUN_DATE: ${{ inputs.run_date }}
          LOCAL_BASELINE_WRITE: ${{ inputs.write_local }}
          LOCAL_BASELINE_CONFIRM: ${{ inputs.confirm }}
        run: python -u src/daily_baseline_from_history.py

      - name: Refresh RVOL30 baseline
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python src/refresh_rvol_baseline.py

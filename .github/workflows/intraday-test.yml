name: Intraday Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intraday-test
  cancel-in-progress: true

jobs:
  intraday-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and push test data
        env:
          GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL }}
          GAS_API_SECRET: ${{ secrets.GAS_API_SECRET }}
        run: python -u src/intraday_test.py

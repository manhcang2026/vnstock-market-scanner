name: EOD Finalize · Local History

on:
  workflow_dispatch:
    inputs:
      trading_date:
        description: "Trading date YYYY-MM-DD; blank = current VN date."
        required: false
        default: ""
        type: string
      dry_run:
        description: "true = verify only; false = production write."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: eod-finalize
  cancel-in-progress: false

jobs:
  eod-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate local EOD pipeline
        run: |
          python -m py_compile src/eod_daily_history_local.py
          python -m py_compile src/daily_baseline_local_runtime.py
          python -m py_compile src/refresh_rvol_baseline_guarded.py

      - name: Finalize daily_history from intraday snapshots
        id: finalize
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EOD_TRADING_DATE: ${{ inputs.trading_date }}
          EOD_WRITE: ${{ inputs.dry_run && 'false' || 'true' }}
        run: python -u src/eod_daily_history_local.py

      - name: Calculate Daily Baseline from daily_history
        if: ${{ steps.finalize.outputs.trading_day == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EOD_TRADING_DATE: ${{ inputs.trading_date }}
          LOCAL_BASELINE_WRITE: ${{ inputs.dry_run && 'false' || 'true' }}
        run: python -u src/daily_baseline_local_runtime.py

      - name: Refresh RVOL30 baseline
        if: ${{ steps.finalize.outputs.trading_day == 'true' && !inputs.dry_run }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -u src/refresh_rvol_baseline_guarded.py

      - name: Upload EOD reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eod-finalize-${{ github.run_id }}
          path: |
            daily_history_eod_local_report.json
          if-no-files-found: warn
          retention-days: 14

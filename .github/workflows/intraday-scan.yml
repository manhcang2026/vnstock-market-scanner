name: Intraday Scan

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intraday-scan
  cancel-in-progress: false

jobs:
  intraday-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Scan and push
        env:
          GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL }}
          GAS_API_SECRET: ${{ secrets.GAS_API_SECRET }}
        run: python src/intraday_scan.py

name: Intraday Scan

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: "Cho phép chạy thủ công ngoài giờ giao dịch"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: intraday-scan
  cancel-in-progress: false

jobs:
  intraday-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scan and push
        env:
          GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL }}
          GAS_API_SECRET: ${{ secrets.GAS_API_SECRET }}
          FORCE_RUN: ${{ inputs.force_run }}
        run: python -u src/intraday_scan.py

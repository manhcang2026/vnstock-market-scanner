name: Update Market Snapshot

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"
permissions:
  contents: write

concurrency:
  group: update-market-snapshot
  cancel-in-progress: false

jobs:
  update-market-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Lay source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cai dat Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cai thu vien
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Quet bang gia va tinh tin hieu
        run: python src/update_market_snapshot.py

      - name: Kiem tra file ket qua
        run: |
          test -f data/latest_snapshot.csv
          test -f data/market_scan_latest.csv
          test -f data/signals_latest.csv

          echo "So dong latest snapshot:"
          wc -l data/latest_snapshot.csv

          echo "So dong market scan:"
          wc -l data/market_scan_latest.csv

          echo "So dong signals:"
          wc -l data/signals_latest.csv

      - name: Gui du lieu sang Google Sheets
        env:
          GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL }}
          GAS_API_SECRET: ${{ secrets.GAS_API_SECRET }}
        run: python src/push_market_scan_to_gas.py

      - name: Luu artifact du phong
        uses: actions/upload-artifact@v6
        with:
          name: market-snapshot-results
          path: |
            data/latest_snapshot.csv
            data/market_scan_latest.csv
            data/signals_latest.csv
          if-no-files-found: error
          retention-days: 7

      - name: Commit snapshot vao repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/latest_snapshot.csv \
            data/market_scan_latest.csv \
            data/signals_latest.csv

          if git diff --cached --quiet; then
            echo "Khong co thay doi de commit."
          else
            git commit -m "Update intraday market snapshot"
            git push
          fi

name: Daily History EOD Fallback

on:
  workflow_dispatch:
    inputs:
      trading_date:
        description: "Ngay giao dich can bo sung (YYYY-MM-DD)."
        required: true
        type: string
      symbols:
        description: "Danh sach ma; de trong = toan watchlist."
        required: false
        default: ""
        type: string
      write:
        description: "false = dry-run; true = insert missing rows + verify."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: daily-history-eod-fallback
  cancel-in-progress: false

jobs:
  eod-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fill daily history from final intraday snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EOD_TRADING_DATE: ${{ inputs.trading_date }}
          EOD_SYMBOLS: ${{ inputs.symbols }}
          EOD_WRITE: ${{ inputs.write }}
        run: python src/eod_daily_history_from_intraday.py

name: Update Daily Indicators

on:
  workflow_dispatch:
  schedule:
    # 18:07 UTC Chủ nhật–Thứ năm
    # = 01:07 sáng Thứ hai–Thứ sáu tại Việt Nam.
    - cron: "7 18 * * 0-4"

permissions:
  contents: write

concurrency:
  group: update-daily-indicators
  cancel-in-progress: false

jobs:
  update-daily-indicators:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Lay source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cai dat Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cai thu vien
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tinh MA200 va KLTB10
        run: python src/update_daily_indicators.py

      - name: Kiem tra file ket qua
        run: |
          test -f data/daily_indicators.csv
          echo "So dong file:"
          wc -l data/daily_indicators.csv
          echo "Xem 5 dong dau:"
          head -n 6 data/daily_indicators.csv

      - name: Luu artifact du phong
        uses: actions/upload-artifact@v6
        with:
          name: daily-indicators
          path: data/daily_indicators.csv
          if-no-files-found: error
          retention-days: 14

      - name: Commit du lieu vao repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/daily_indicators.csv

          if git diff --cached --quiet; then
            echo "Khong co thay doi de commit."
          else
            git commit -m "Update daily MA200 and average volume"
            git push
          fi
